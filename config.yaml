# ReACT-seq (RT-stop) pipeline configuration template.
# Paths use /path/to/... placeholders; fill them in before running.

# Preset selecting the analysis track (paired-end only; rRNA removed in all):
#   human_trans : human transcriptome RT-stop, STAR alignment
#   ecoli_trans : E. coli transcriptome RT-stop, bowtie2 alignment
#   ecoli_tRNA  : E. coli tRNA-only RT-stop (all or selected tRNAs)
preset: ecoli_tRNA

samples:
  - sample1
  - sample2
# IP / treatment (enriched) samples used for high-stop site calling and,
# when peak calling is enabled, as macs2 IP replicates (must be a subset
# of samples; >= 2 for IDR).
ip_samples:
  - sample1
  - sample2
# Input / control samples used as macs2 controls (required when peak
# calling is enabled).
input_samples:
  - input1

datadir: /path/to/fastq
outdir: /path/to/rts_stop_results
refdir: /path/to/reference

# Path to the repo helper scripts, relative to this pipeline directory.
libsdir: libs

# Input fastq naming: {sample}<suffix>. Paired-end only.
fq1_suffix: _R1.fq.gz
fq2_suffix: _R2.fq.gz

# Threads / small runtime parameters.
trim_threads: 4
align_threads: 8
pileup_max_depth: 20000000
stop_min_cov: 1
# Interpreter for libs/RTstop_count.py (legacy Python 2 script).
stop_python: python3

# --- peak calling (enrichment analysis) -------------------------------------
# Performed by default in the transcriptome presets (human_trans and
# ecoli_trans); not applied to the tRNA-only preset. Requires >= 2 IP
# replicates for IDR. Uncomment to override per preset:
# run_peak_calling: true
macs2_gsize: 4.6e6        # effective genome size (E. coli ~4.6e6; human ~2.7e9)
macs2_qvalue: 0.05
peak_threads: 4

# --- high-stop site calling script (libs/ filename, per species) ------------
find_stop_script_ecoli: ecoli_RT_findstopsite.py
find_stop_script_human: find_highstop_hg38.py

# --- primary-track references ---------------------------------------------
# Input formats:
#   star_index    : STAR genome directory (built with STAR --runMode genomeGenerate)
#   bowtie2_index : bowtie2 index prefix (the path before .1.bt2 / .rev.1.bt2)
#   genome_fasta  : genome FASTA (same chromosome naming as the BED files)
#   gene_plus_bed : BED3+name of plus-strand genes/transcripts:
#                   chr<TAB>start<TAB>end<TAB>gene_id  (0-based, half-open)
#   gene_minus_bed: same format, minus-strand genes/transcripts
#   peaks_bed     : BED3 candidate regions (chr<TAB>start<TAB>end), used to
#                   restrict high-stop site calling
star_index: /path/to/STAR_index
bowtie2_index: /path/to/bowtie2_genome_or_tRNA_index
genome_fasta: /path/to/genome.fa
gene_plus_bed: /path/to/gene_plus.bed
gene_minus_bed: /path/to/gene_minus.bed
peaks_bed: /path/to/candidate_regions.bed

# rRNA index for pre-alignment depletion (all presets), per species.
# Format: bowtie2 index prefix (same as bowtie2_index).
rRNA_index_ecoli: /path/to/bowtie2_rRNA_index_ecoli
rRNA_index_human: /path/to/bowtie2_rRNA_index_human

# ecoli_tRNA references.
# trna_fasta may contain ALL tRNA sequences or only a selected subset
# (e.g. specific isoacceptors); keep it consistent with the BED files.
#   trna_fasta     : tRNA FASTA (all tRNAs or a selected subset)
#   trna_plus_bed  : BED3+name of plus-strand tRNAs (chr start end trna_id)
#   trna_minus_bed : BED3+name of minus-strand tRNAs
#   trna_peaks_bed : BED3 candidate regions around tRNAs
tRNA_index: /path/to/bowtie2_tRNA_index
trna_fasta: /path/to/tRNA.fa
trna_plus_bed: /path/to/tRNA.plus.bed
trna_minus_bed: /path/to/tRNA.minus.bed
trna_peaks_bed: /path/to/tRNA.candidate_regions.bed